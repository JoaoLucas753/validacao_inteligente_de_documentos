spring.application.name=validacao_inteligente_de_documentos
server.error.include-message=always

# Upload (máx. 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Banco: H2 em memória por padrão (zero configuração).
# Para PostgreSQL: docker compose up -d  e rodar com  --spring.profiles.active=postgres
spring.datasource.url=jdbc:h2:mem:validacao;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Tesseract (instalado no sistema)
app.ocr.command=tesseract
app.ocr.language=por

# OpenAI: NÃO escreva a chave aqui. Use a variável de ambiente OPENAI_API_KEY.
# Em branco = o sistema usa extração por Regex (sem IA).
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=gpt-4o-mini
app.ai.openai.base-url=https://api.openai.com/v1
