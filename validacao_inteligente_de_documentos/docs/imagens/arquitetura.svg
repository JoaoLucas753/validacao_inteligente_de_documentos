<text x="37" y="622" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Sem IA?  Extraia com palavras-chave + Regex (já incluído como alternativa no projeto).</text>
