<text x="37" y="674" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">Para ensino, o fluxo com OpenCV + Tesseract + IA mostra claramente o papel de cada tecnologia.</text>
